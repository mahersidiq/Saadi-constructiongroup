<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 661 152" role="img" aria-labelledby="title desc">
  <title id="title">Saadi Construction Group</title>
  <desc id="desc">Horizontal transparent light logo assembled from the existing Saadi Construction Group source artwork.</desc>
  <defs>
    <clipPath id="markClip"><rect width="208" height="277"/></clipPath>
    <clipPath id="wordmarkClip"><rect width="772" height="192"/></clipPath>
    <mask id="markMask" maskUnits="userSpaceOnUse" x="0" y="0" width="208" height="277" style="mask-type:luminance">
      <image href="logo.png" x="-408" y="-205" width="1024" height="1024"/>
    </mask>
    <mask id="wordmarkMask" maskUnits="userSpaceOnUse" x="0" y="0" width="772" height="192" style="mask-type:luminance">
      <image href="logo.png" x="-126" y="-532" width="1024" height="1024"/>
    </mask>
  </defs>
  <g transform="translate(0 10) scale(0.4765)" clip-path="url(#markClip)" mask="url(#markMask)">
    <image href="logo.png" x="-408" y="-205" width="1024" height="1024"/>
  </g>
  <g transform="translate(141 15) scale(0.6736)" clip-path="url(#wordmarkClip)" mask="url(#wordmarkMask)">
    <image href="logo.png" x="-126" y="-532" width="1024" height="1024"/>
  </g>
</svg>
