<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 510" role="img" aria-labelledby="title desc">
  <title id="title">Saadi Construction Group stacked logo</title>
  <desc id="desc">Stacked transparent logo cropped from the existing Saadi Construction Group source artwork.</desc>
  <defs>
    <clipPath id="stackedClip"><rect width="772" height="510"/></clipPath>
    <mask id="stackedMask" maskUnits="userSpaceOnUse" x="0" y="0" width="772" height="510" style="mask-type:luminance">
      <image href="logo.png" x="-126" y="-214" width="1024" height="1024"/>
    </mask>
  </defs>
  <g clip-path="url(#stackedClip)" mask="url(#stackedMask)">
    <image href="logo.png" x="-126" y="-214" width="1024" height="1024"/>
  </g>
</svg>
